name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare public site files
        run: |
          mkdir -p _site
          cp index.html styles.css experience.css app.js contact.js motion.js draft-preview.js portfolio.js .nojekyll _site/
          cp -R assets _site/assets
          mkdir -p _site/admin
          cp admin/index.html admin/admin.css admin/admin.js admin/model.mjs admin/github.mjs _site/admin/
          python3 - <<'PYTHON'
          import os, pathlib, re
          for name in ('index.html', 'admin/index.html'):
              path = pathlib.Path('_site') / name
              text = path.read_text()
              prefix = './' if name == 'index.html' else '../'
              text = text.replace(f'src="{prefix}portfolio.js"', f'src="{prefix}portfolio.js?v={os.environ["GITHUB_SHA"]}"')
              if name == 'admin/index.html':
                  text = re.sub(r'(\./admin\.(?:js|css))(?:\?v=[^"\s]*)?', lambda m: m[1] + '?v=' + os.environ['GITHUB_SHA'], text)
              path.write_text(text)
          for name in ('admin/admin.js', 'admin/github.mjs'):
              path = pathlib.Path('_site') / name
              text = re.sub(r"(\./(?:model|github)\.mjs)(?:\?v=[^'\s]*)?", lambda m: m[1] + '?v=' + os.environ['GITHUB_SHA'], path.read_text())
              path.write_text(text)
          PYTHON

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
